<svg xmlns="http://www.w3.org/2000/svg" width="515" height="215" viewBox="0 0 515 215" fill="none">
    <!-- Outer light gray background -->
    <rect width="515" height="215" fill="#fafafa"/>
    
    <!-- Group to center the icon in the 515x215 canvas -->
    <!-- Original icon was 24x24. Let's scale it up and center it.
         Let's make the icon size around 120x120. Scale factor = 120/24 = 5.
         Center X = (515 - 120) / 2 = 197.5
         Center Y = (215 - 120) / 2 = 47.5
    -->
    <g transform="translate(197.5, 47.5) scale(5)">
        <!-- Inner rounded rectangle -->
        <rect x="3" y="3" width="18" height="18" rx="2.5" fill="#e2e4e7"/>
        <!-- Sun / Circle -->
        <circle cx="8.5" cy="8.5" r="2" fill="#ced1d5"/>
        <!-- Mountains -->
        <path d="M21 16.5L14.5 9.5 10.5 14 7.5 11 3 16V18.5C3 19.88 4.12 21 5.5 21h13c1.38 0 2.5-1.12 2.5-2.5v-2z" fill="#c3c6cb"/>
    </g>
</svg>
